
<!DOCTYPE html>

<html lang="es">

<head>

    <meta charset="UTF-8">

    <title>Abriendo Obsidian...</title>

</head>

<body>

    <div style="text-align: center; margin-top: 100px; font-family: sans-serif;">

        <h2>Abriendo tu nota en Obsidian...</h2>

        <p>Puedes cerrar esta pestaña si no se cierra automáticamente.</p>

    </div>

    <script>

        // 1. Obtener la URL actual que causó el "404"

        const currentUrl = window.location.href;
        
        // 2. Reemplazar la raíz de GitHub por el protocolo local de Obsidian

        let redirectUrl = currentUrl.replace("https://fpotes.github.io/obsidian-redirect/", "obsidian://");
        
        // 3. TRADUCCIÓN INTELIGENTE:

        // Si el enlace viene como "adv-uri", lo convertimos a "advanced-uri"

        // para garantizar compatibilidad total en macOS.

        if (redirectUrl.includes("obsidian://adv-uri")) {

            redirectUrl = redirectUrl.replace("obsidian://adv-uri", "obsidian://advanced-uri");

        }
        
        // 4. Disparar la redirección local

        window.location.href = redirectUrl;
        
        // 5. Intentar cerrar la pestaña del navegador automáticamente

        setTimeout(() => {

            window.close();

        }, 1500);

    </script>

</body>

</html>
