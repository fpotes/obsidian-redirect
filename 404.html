
<!DOCTYPE html>

<html lang="es">

<head>

    <meta charset="UTF-8">

    <title>Abriendo Obsidian...</title>

</head>

<body>

    <div style="text-align: center; margin-top: 100px; font-family: sans-serif;">

        <h2>Abriendo tu nota en Obsidian...</h2>

        <p>Puedes cerrar esta pestaña si no se cierra automáticamente.</p>

    </div>

    <script>

        // 1. Obtener la URL que causó el "404" (ej: https://fpotes.github.io/obsidian-redirect/advanced-uri?vault=...)

        const currentUrl = window.location.href;
        
        // 2. Reemplazar la raíz de GitHub por el protocolo local de Obsidian

        const redirectUrl = currentUrl.replace("https://fpotes.github.io/obsidian-redirect/", "obsidian://");
        
        // 3. Disparar la redirección local para abrir Obsidian

        window.location.href = redirectUrl;
        
        // 4. Intentar cerrar la pestaña del navegador automáticamente

        setTimeout(() => {

            window.close();

        }, 1500);

    </script>

</body>

</html>
